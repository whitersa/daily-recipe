<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png">
    
    <!-- PWA & Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>每日食谱</title>
    
    <!-- Typography: 100% Offline Native Stack -->
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
      }
      /* Prevent overscroll bounce on body */
      html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;

      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

  </head>
  <body class="bg-[#F5F5F7] text-[#1C1C1E] antialiased">
